org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
# This newDsl flag was added by the Flutter template
android.newDsl=false
# This builtInKotlin flag was added by the Flutter template
android.builtInKotlin=false
# Added: this project links several native plugins at once (agora_rtc_engine,
# camera, record, image_picker), which makes a cold Gradle build noticeably
# slower and, on some machines, prone to timing out. These three are safe,
# well-established Gradle settings that speed up and stabilize exactly that
# situation — none of them change what gets built, only how efficiently.
org.gradle.parallel=true
org.gradle.caching=true
