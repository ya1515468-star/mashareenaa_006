name: Apply MASHAREENA Chat Fixes

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Apply chat fixes patch
        shell: bash
        run: |
          set -e
          if [ ! -f .chatfix-parts/part-001.patch ]; then
            echo "No patch parts found; nothing to apply."
            exit 0
          fi
          cat .chatfix-parts/part-*.patch > /tmp/chatfix.patch
          git apply --check --whitespace=nowarn /tmp/chatfix.patch
          git apply --whitespace=nowarn /tmp/chatfix.patch
          git diff --check

      - name: Commit source changes only
        shell: bash
        run: |
          set -e
          rm -rf .chatfix-parts
          git add -A -- lib pubspec.yaml supabase test
          if git diff --cached --quiet; then
            echo "No source changes to commit."
            exit 0
          fi
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com'             commit -m 'Implement chat voice music YouTube and mic fixes'
          git push
