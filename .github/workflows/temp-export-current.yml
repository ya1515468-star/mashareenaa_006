name: Temporary current tree export
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - run: git archive --format=zip --output=current-tree.zip HEAD
      - uses: actions/upload-artifact@v4
        with:
          name: current-tree-export
          path: current-tree.zip
          retention-days: 1
