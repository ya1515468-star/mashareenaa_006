name: Temporary repository export for FINAL45 comparison

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Export repository
        run: git archive --format=zip --output=current-repo.zip HEAD
      - name: Upload repository archive
        uses: actions/upload-artifact@v4
        with:
          name: current-repo-export
          path: current-repo.zip
          retention-days: 1
