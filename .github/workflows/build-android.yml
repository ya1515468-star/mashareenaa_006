name: MASHAREENA Android ARM64 Release

on:
  push:
    branches: [main, master]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-arm64:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Apply FINAL43 complete lib replacement (one-time)
        shell: bash
        run: |
          if [ -f "FINAL43_LIB_FULL_REPLACEMENT.patch.gz.b64" ]; then
            echo "Applying FINAL43 lib replacement..."
            base64 --decode "FINAL43_LIB_FULL_REPLACEMENT.patch.gz.b64" > /tmp/final43-lib.patch.gz
            gunzip -c /tmp/final43-lib.patch.gz > /tmp/final43-lib.patch
            git apply --whitespace=nowarn /tmp/final43-lib.patch
            test ! -f "lib/features/chat/presentation/widgets/voice_recorder_sheet.dart"
            test -f "lib/features/chat/presentation/widgets/forward_message_sheet.dart"
            test -f "lib/features/chat/presentation/widgets/voice_message_player.dart"
            test -f "lib/features/chat/data/services/voice_upload_helper.dart"
            test -f "lib/features/chat/presentation/widgets/animated_dice_roller.dart"
            rm -f "FINAL43_LIB_FULL_REPLACEMENT.patch.gz.b64"
            cat > .github/workflows/build-android.yml <<'EOF_WORKFLOW'
name: MASHAREENA Android ARM64 Release

on:
  push:
    branches: [main, master]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-arm64:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Align CI-only dependency compatibility
        run: |
          sed -i -E 's/record:[[:space:]]+\^?5\.1\.2/record: 6.2.1/' pubspec.yaml

      - name: Flutter pub get
        run: flutter pub get

      - name: Flutter analyze
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Flutter tests
        run: flutter test

      - name: Verify release signing secrets
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          test -n "$KEYSTORE_B64" || (echo "ANDROID_KEYSTORE_BASE64 is missing" && exit 1)
          test -n "$KEYSTORE_PASSWORD" || (echo "ANDROID_KEYSTORE_PASSWORD is missing" && exit 1)
          test -n "$KEY_ALIAS" || (echo "ANDROID_KEY_ALIAS is missing" && exit 1)
          test -n "$KEY_PASSWORD" || (echo "ANDROID_KEY_PASSWORD is missing" && exit 1)

      - name: Configure release keystore
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          printf '%s' "$KEYSTORE_B64" | base64 --decode > android/app/mashareena-upload.jks
          cat > android/key.properties <<EOF2
          storeFile=mashareena-upload.jks
          storePassword=$KEYSTORE_PASSWORD
          keyAlias=$KEY_ALIAS
          keyPassword=$KEY_PASSWORD
          EOF2
          chmod 600 android/app/mashareena-upload.jks android/key.properties

      - name: Build signed ARM64 APK
        run: |
          flutter build apk --release \
            --target-platform android-arm64 \
            --split-per-abi

      - name: Verify APK architecture and signature
        run: |
          APK=build/app/outputs/flutter-apk/app-arm64-v8a-release.apk
          test -f "$APK"
          unzip -l "$APK" | grep -q 'lib/arm64-v8a/'
          ! unzip -l "$APK" | grep -qE 'lib/(armeabi-v7a|x86|x86_64)/' || exit 1
          "$ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)/apksigner" verify --verbose "$APK"
          mkdir -p out
          cp "$APK" "out/MASHAREENA-arm64-${GITHUB_SHA::7}.apk"
          ls -lh out/

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: MASHAREENA-arm64-release
          path: out/*.apk
          retention-days: 30

      - name: GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: out/*.apk
          generate_release_notes: true
EOF_WORKFLOW
            git add -A -- .github/workflows/build-android.yml FINAL43_LIB_FULL_REPLACEMENT.patch.gz.b64 lib
            if git diff --cached --quiet; then
              echo "No FINAL43 changes detected."
            else
              git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'Replace lib with FINAL43 source [skip ci]'
              git push
            fi
          fi

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.2'
          channel: stable
          cache: true

      - name: Align CI-only dependency compatibility
        run: |
          sed -i -E 's/record:[[:space:]]+\^?5\.1\.2/record: 6.2.1/' pubspec.yaml

      - name: Flutter pub get
        run: flutter pub get

      - name: Flutter analyze
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Flutter tests
        run: flutter test

      - name: Verify release signing secrets
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          test -n "$KEYSTORE_B64" || (echo "ANDROID_KEYSTORE_BASE64 is missing" && exit 1)
          test -n "$KEYSTORE_PASSWORD" || (echo "ANDROID_KEYSTORE_PASSWORD is missing" && exit 1)
          test -n "$KEY_ALIAS" || (echo "ANDROID_KEY_ALIAS is missing" && exit 1)
          test -n "$KEY_PASSWORD" || (echo "ANDROID_KEY_PASSWORD is missing" && exit 1)

      - name: Configure release keystore
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          printf '%s' "$KEYSTORE_B64" | base64 --decode > android/app/mashareena-upload.jks
          cat > android/key.properties <<EOF2
          storeFile=mashareena-upload.jks
          storePassword=$KEYSTORE_PASSWORD
          keyAlias=$KEY_ALIAS
          keyPassword=$KEY_PASSWORD
          EOF2
          chmod 600 android/app/mashareena-upload.jks android/key.properties

      - name: Build signed ARM64 APK
        run: |
          flutter build apk --release \
            --target-platform android-arm64 \
            --split-per-abi

      - name: Verify APK architecture and signature
        run: |
          APK=build/app/outputs/flutter-apk/app-arm64-v8a-release.apk
          test -f "$APK"
          unzip -l "$APK" | grep -q 'lib/arm64-v8a/'
          ! unzip -l "$APK" | grep -qE 'lib/(armeabi-v7a|x86|x86_64)/' || exit 1
          "$ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)/apksigner" verify --verbose "$APK"
          mkdir -p out
          cp "$APK" "out/MASHAREENA-arm64-${GITHUB_SHA::7}.apk"
          ls -lh out/

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: MASHAREENA-arm64-release
          path: out/*.apk
          retention-days: 30

      - name: GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: out/*.apk
          generate_release_notes: true
