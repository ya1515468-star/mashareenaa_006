name: MASHAREENA Android ARM64 Release

# أُوقف التشغيل التلقائي: build-all.yml صار يبني كل النسخ (AAB + arm64 +
# شاملة + iOS) عند كل دفع. هذا الملف يبقى للتشغيل اليدوي فقط عند الحاجة
# إلى نسخة arm64 وحدها بسرعة، كي لا يعمل بناءان متوازيان على كل دفعة.
on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: mashareena-arm64-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-arm64:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.2'
          channel: stable
          cache: true

      - name: Check source release configuration
        run: |
          test -f pubspec.yaml
          test -f android/app/proguard-rules.pro
          test -f assets/fonts/decorative/OFL.txt
          ! grep -qE '^[[:space:]]*record:[[:space:]]*\^?5\.1\.2[[:space:]]*$' pubspec.yaml
          test ! -e android/key.properties
          test -z "$(find android/app -maxdepth 1 -type f \( -name '*.jks' -o -name '*.keystore' \) -print -quit)"

      - name: Flutter pub get
        run: flutter pub get

      - name: Flutter analyze
        run: |
          set -o pipefail
          if ! flutter analyze --no-fatal-infos --no-fatal-warnings 2>&1 | tee analyze.txt; then
            # أخطاء المحلّل كتعليقات (Annotations) تُقرأ عبر واجهة GitHub حتى حين تُحجب السجلات.
            grep -E "error •" analyze.txt | head -50 | sed 's/^/::error::/'
            exit 1
          fi

      - name: Flutter tests
        run: |
          set -o pipefail
          if ! flutter test 2>&1 | tee test.txt; then
            grep -E "Error|error:|Expected|Actual|FAILED" test.txt | head -40 | sed 's/^/::error::/'
            exit 1
          fi

      - name: Verify release signing secrets
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          test -n "$KEYSTORE_B64" || (echo "ANDROID_KEYSTORE_BASE64 is missing" && exit 1)
          test -n "$KEYSTORE_PASSWORD" || (echo "ANDROID_KEYSTORE_PASSWORD is missing" && exit 1)
          test -n "$KEY_ALIAS" || (echo "ANDROID_KEY_ALIAS is missing" && exit 1)
          test -n "$KEY_PASSWORD" || (echo "ANDROID_KEY_PASSWORD is missing" && exit 1)

      - name: Configure release keystore
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          printf '%s' "$KEYSTORE_B64" | base64 --decode > android/app/mashareena-upload.jks
          cat > android/key.properties <<EOF2
          storeFile=mashareena-upload.jks
          storePassword=$KEYSTORE_PASSWORD
          keyAlias=$KEY_ALIAS
          keyPassword=$KEY_PASSWORD
          EOF2
          chmod 600 android/app/mashareena-upload.jks android/key.properties

      - name: Build signed ARM64 APK
        run: |
          flutter build apk --release \
            --target-platform android-arm64 \
            --split-per-abi

      - name: Verify APK architecture and signature
        run: |
          APK=build/app/outputs/flutter-apk/app-arm64-v8a-release.apk
          test -f "$APK"
          unzip -l "$APK" | grep -q 'lib/arm64-v8a/'
          ! unzip -l "$APK" | grep -qE 'lib/(armeabi-v7a|x86|x86_64)/' || exit 1
          "$ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)/apksigner" verify --verbose "$APK"
          mkdir -p out
          cp "$APK" "out/MASHAREENA-arm64-${GITHUB_SHA::7}.apk"
          ls -lh out/

      - name: Generate third-party notices and release metadata
        run: |
          python3 scripts/generate_third_party_notices.py --output out/THIRD_PARTY_NOTICES.txt
          cp assets/fonts/decorative/OFL.txt out/SIL-OPEN-FONT-LICENSE-1.1.txt
          cat > out/BUILD_INFO.txt <<EOF2
          Project: MASHAREENA
          Repository: ${GITHUB_REPOSITORY}
          Commit: ${GITHUB_SHA}
          Flutter: 3.47.2 stable
          Java: 17
          Target ABI: android-arm64 (arm64-v8a)
          Build mode: release
          Application ID: com.mashareena.mashareena
          Version: $(sed -n 's/^version:[[:space:]]*//p' pubspec.yaml | head -1)
          EOF2
          (cd out && sha256sum "MASHAREENA-arm64-${GITHUB_SHA::7}.apk" > SHA256SUMS.txt)
          (cd out && zip -q "MASHAREENA-ARM64-${GITHUB_SHA::7}.zip" \
            "MASHAREENA-arm64-${GITHUB_SHA::7}.apk" \
            BUILD_INFO.txt SHA256SUMS.txt THIRD_PARTY_NOTICES.txt SIL-OPEN-FONT-LICENSE-1.1.txt)
          ls -lh out/

      - name: Upload APK and release records
        uses: actions/upload-artifact@v4
        with:
          name: MASHAREENA-arm64-release
          path: out/*
          retention-days: 30

      - name: GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            out/*.apk
            out/*.zip
            out/SHA256SUMS.txt
            out/BUILD_INFO.txt
            out/THIRD_PARTY_NOTICES.txt
          generate_release_notes: true

      # رابط تنزيل مباشر لآخر نسخة على main: إصدار تمهيدي ثابت الاسم يُحدَّث كل بناء.
      - name: Publish latest build (pre-release)
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest-build
          name: Latest build (${{ github.sha }})
          prerelease: true
          target_commitish: ${{ github.sha }}
          files: |
            out/*.apk
            out/SHA256SUMS.txt

      - name: Remove temporary signing files
        if: always()
        run: rm -f android/app/mashareena-upload.jks android/key.properties
