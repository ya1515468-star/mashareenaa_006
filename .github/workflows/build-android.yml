name: MASHAREENA Android ARM64 Release

on:
  push:
    branches: [main, master]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-arm64:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:

      - name: Apply FINAL43 complete lib replacement (one-time)
        shell: bash
        run: |
          if [ ! -f "FINAL43_LIB_FULL_REPLACEMENT.patch.gz.b64" ]; then
            exit 0
          fi
          echo "Applying FINAL43 complete lib replacement..."
          base64 --decode "FINAL43_LIB_FULL_REPLACEMENT.patch.gz.b64" > /tmp/final43-lib.patch.gz
          gunzip -c /tmp/final43-lib.patch.gz > /tmp/final43-lib.patch
          git apply --whitespace=nowarn /tmp/final43-lib.patch
          test ! -f "lib/features/chat/presentation/widgets/voice_recorder_sheet.dart"
          test -f "lib/features/chat/presentation/widgets/forward_message_sheet.dart"
          test -f "lib/features/chat/presentation/widgets/voice_message_player.dart"
          test -f "lib/features/chat/data/services/voice_upload_helper.dart"
          test -f "lib/features/chat/presentation/widgets/animated_dice_roller.dart"
          git diff --check
          cp ".github/workflows/build-android.yml.final40" ".github/workflows/build-android.yml"
          rm -f "FINAL43_LIB_FULL_REPLACEMENT.patch.gz.b64" ".github/workflows/build-android.yml.final40"
          git add -A -- lib .github/workflows/build-android.yml FINAL43_LIB_FULL_REPLACEMENT.patch.gz.b64 .github/workflows/build-android.yml.final40
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'Replace lib with FINAL43 source [skip ci]'
          git push
